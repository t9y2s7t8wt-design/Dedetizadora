<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Clientes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde-escuro: #1a3a2a;
      --verde-medio: #2d6a4f;
      --verde-claro: #52b788;
      --bege: #f5f0e8;
      --bege-escuro: #e8e0d0;
      --texto: #1a1a1a;
      --texto-suave: #5a5a5a;
      --erro: #c0392b;
      --branco: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bege);
      color: var(--texto);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: var(--verde-escuro);
      color: var(--branco);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    header span {
      font-size: 12px;
      color: var(--verde-claro);
      font-weight: 500;
    }

    /* TABS */
    .tabs {
      display: flex;
      background: var(--verde-escuro);
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--verde-claro);
      border-bottom-color: var(--verde-claro);
    }

    /* CONTEÚDO */
    .view { display: none; padding: 20px; }
    .view.active { display: block; }

    /* FORMULÁRIO */
    .section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--verde-medio);
      margin: 24px 0 12px;
    }

    .section-title:first-child { margin-top: 0; }

    .tipo-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tipo-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--bege-escuro);
      border-radius: 10px;
      background: var(--branco);
      font-size: 14px;
      font-weight: 600;
      color: var(--texto-suave);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .tipo-btn.active {
      border-color: var(--verde-medio);
      color: var(--verde-medio);
      background: #f0f7f4;
    }

    .campo {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--texto-suave);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    label .opcional {
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      color: #aaa;
      font-size: 11px;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--bege-escuro);
      border-radius: 10px;
      font-size: 15px;
      background: var(--branco);
      color: var(--texto);
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--verde-medio);
    }

    input.erro { border-color: var(--erro); }

    .msg-erro {
      font-size: 11px;
      color: var(--erro);
      margin-top: 4px;
      display: none;
    }

    .msg-erro.visivel { display: block; }

    .linha-dupla {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-salvar {
      width: 100%;
      padding: 16px;
      background: var(--verde-medio);
      color: var(--branco);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 24px;
      letter-spacing: 0.3px;
      transition: background 0.2s;
    }

    .btn-salvar:active { background: var(--verde-escuro); }

    /* LISTA */
    .busca-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .busca-wrap input {
      padding-left: 40px;
    }

    .busca-icone {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 16px;
      pointer-events: none;
    }

    .contador {
      font-size: 12px;
      color: var(--texto-suave);
      margin-bottom: 12px;
    }

    .lista-vazia {
      text-align: center;
      padding: 48px 20px;
      color: var(--texto-suave);
    }

    .lista-vazia .icone { font-size: 40px; margin-bottom: 12px; }
    .lista-vazia p { font-size: 14px; }

    .card-cliente {
      background: var(--branco);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
      border: 1.5px solid var(--bege-escuro);
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .card-cliente:active { border-color: var(--verde-claro); }

    .card-topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .card-nome {
      font-size: 15px;
      font-weight: 700;
      color: var(--texto);
      flex: 1;
      margin-right: 8px;
    }

    .badge-tipo {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 20px;
      flex-shrink: 0;
    }

    .badge-pf {
      background: #e8f4f0;
      color: var(--verde-medio);
    }

    .badge-pj {
      background: #e8eef8;
      color: #2d4a8a;
    }

    .card-info {
      font-size: 13px;
      color: var(--texto-suave);
      line-height: 1.5;
    }

    /* MODAL / DETALHE */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: flex-end;
    }

    .overlay.aberto { display: flex; }

    .modal {
      background: var(--bege);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px 20px 40px;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-handle {
      width: 40px;
      height: 4px;
      background: var(--bege-escuro);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .modal-nome {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .modal-doc {
      font-size: 13px;
      color: var(--texto-suave);
      margin-bottom: 20px;
    }

    .detalhe-linha {
      display: flex;
      flex-direction: column;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--bege-escuro);
    }

    .detalhe-linha:last-of-type { border-bottom: none; }

    .detalhe-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--verde-medio);
      margin-bottom: 3px;
    }

    .detalhe-valor {
      font-size: 15px;
      color: var(--texto);
    }

    .modal-acoes {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-editar, .btn-excluir {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-editar {
      background: var(--verde-medio);
      color: var(--branco);
    }

    .btn-excluir {
      background: #fce8e6;
      color: var(--erro);
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--verde-escuro);
      color: var(--branco);
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s;
      z-index: 300;
      white-space: nowrap;
    }

    .toast.visivel {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<header>
  <h1>Clientes</h1>
  <span id="total-header"></span>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="mudarAba('lista')">📋 Lista</button>
  <button class="tab-btn" onclick="mudarAba('novo')">➕ Novo cliente</button>
</div>

<!-- LISTA -->
<div class="view active" id="view-lista">
  <div class="busca-wrap">
    <span class="busca-icone">🔍</span>
    <input type="search" placeholder="Buscar por nome, CPF, CNPJ..." id="campo-busca" oninput="filtrarLista()" />
  </div>
  <p class="contador" id="contador"></p>
  <div id="lista-clientes"></div>
</div>

<!-- FORMULÁRIO -->
<div class="view" id="view-novo">

  <div class="tipo-selector">
    <button class="tipo-btn active" id="btn-pf" onclick="selecionarTipo('PF')">👤 Pessoa Física</button>
    <button class="tipo-btn" id="btn-pj" onclick="selecionarTipo('PJ')">🏢 Pessoa Jurídica</button>
  </div>

  <p class="section-title">Identificação</p>

  <div class="campo" id="campo-nome-wrap">
    <label>Nome completo</label>
    <input type="text" id="nome" placeholder="Ex: João da Silva" oninput="limparErro('nome')" />
    <p class="msg-erro" id="erro-nome">Campo obrigatório</p>
  </div>

  <div class="campo" id="campo-razao-wrap" style="display:none">
    <label>Razão social</label>
    <input type="text" id="razao" placeholder="Ex: Silva Serviços Ltda" oninput="limparErro('razao')" />
    <p class="msg-erro" id="erro-razao">Campo obrigatório</p>
  </div>

  <div class="campo" id="campo-cpf-wrap">
    <label>CPF</label>
    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this); limparErro('cpf')" inputmode="numeric" />
    <p class="msg-erro" id="erro-cpf">CPF inválido</p>
  </div>

  <div class="campo" id="campo-cnpj-wrap" style="display:none">
    <label>CNPJ</label>
    <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18" oninput="mascaraCNPJ(this); limparErro('cnpj')" inputmode="numeric" />
    <p class="msg-erro" id="erro-cnpj">CNPJ inválido</p>
  </div>

  <div class="campo" id="campo-responsavel-wrap" style="display:none">
    <label>Responsável <span class="opcional">(opcional)</span></label>
    <input type="text" id="responsavel" placeholder="Nome do responsável" />
  </div>

  <p class="section-title">Endereço</p>

  <div class="campo">
    <label>CEP <span class="opcional">(opcional)</span></label>
    <input type="text" id="cep" placeholder="00000-000" maxlength="9" oninput="mascaraCEP(this)" inputmode="numeric" />
  </div>

  <div class="campo">
    <label>Logradouro</label>
    <input type="text" id="rua" placeholder="Rua, Avenida, Travessa..." oninput="limparErro('rua')" />
    <p class="msg-erro" id="erro-rua">Campo obrigatório</p>
  </div>

  <div class="linha-dupla">
    <div class="campo">
      <label>Número</label>
      <input type="text" id="numero" placeholder="Nº" oninput="limparErro('numero')" />
      <p class="msg-erro" id="erro-numero">Obrigatório</p>
    </div>
    <div class="campo">
      <label>Complemento <span class="opcional">(opcional)</span></label>
      <input type="text" id="complemento" placeholder="Apto, Sala..." />
    </div>
  </div>

  <div class="campo">
    <label>Bairro</label>
    <input type="text" id="bairro" placeholder="Nome do bairro" oninput="limparErro('bairro')" />
    <p class="msg-erro" id="erro-bairro">Campo obrigatório</p>
  </div>

  <div class="linha-dupla">
    <div class="campo">
      <label>Cidade</label>
      <input type="text" id="cidade" placeholder="Cidade" oninput="limparErro('cidade')" />
      <p class="msg-erro" id="erro-cidade">Obrigatório</p>
    </div>
    <div class="campo">
      <label>Estado</label>
      <select id="estado">
        <option value="">UF</option>
        <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
        <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
        <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
        <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
        <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
        <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
        <option selected>SP</option><option>SE</option><option>TO</option>
      </select>
    </div>
  </div>

  <p class="section-title">Contato</p>

  <div class="campo">
    <label>WhatsApp <span class="opcional">(opcional)</span></label>
    <input type="text" id="whatsapp" placeholder="(00) 00000-0000" maxlength="15" oninput="mascaraTelefone(this)" inputmode="numeric" />
  </div>

  <p class="section-title">Observações</p>

  <div class="campo">
    <label>Observações <span class="opcional">(opcional)</span></label>
    <textarea id="obs" placeholder="Informações adicionais sobre o cliente..."></textarea>
  </div>

  <button class="btn-salvar" onclick="salvarCliente()">Salvar cliente</button>
</div>

<!-- MODAL DETALHE -->
<div class="overlay" id="overlay" onclick="fecharModal(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div id="modal-conteudo"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let clientes = JSON.parse(localStorage.getItem('clientes') || '[]');
  let tipoAtual = 'PF';
  let clienteEditando = null;
  let indiceEditando = null;

  function salvarStorage() {
    localStorage.setItem('clientes', JSON.stringify(clientes));
  }

  function mudarAba(aba) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('view-' + aba).classList.add('active');
    document.querySelectorAll('.tab-btn')[aba === 'lista' ? 0 : 1].classList.add('active');
    if (aba === 'lista') renderLista();
  }

  function selecionarTipo(tipo) {
    tipoAtual = tipo;
    document.getElementById('btn-pf').classList.toggle('active', tipo === 'PF');
    document.getElementById('btn-pj').classList.toggle('active', tipo === 'PJ');
    document.getElementById('campo-nome-wrap').style.display = tipo === 'PF' ? '' : 'none';
    document.getElementById('campo-cpf-wrap').style.display = tipo === 'PF' ? '' : 'none';
    document.getElementById('campo-razao-wrap').style.display = tipo === 'PJ' ? '' : 'none';
    document.getElementById('campo-cnpj-wrap').style.display = tipo === 'PJ' ? '' : 'none';
    document.getElementById('campo-responsavel-wrap').style.display = tipo === 'PJ' ? '' : 'none';
  }

  function mascaraCPF(el) {
    let v = el.value.replace(/\D/g, '').slice(0, 11);
    if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
    else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
    else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, '$1.$2');
    el.value = v;
  }

  function mascaraCNPJ(el) {
    let v = el.value.replace(/\D/g, '').slice(0, 14);
    if (v.length > 12) v = v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2})/, '$1.$2.$3/$4-$5');
    else if (v.length > 8) v = v.replace(/(\d{2})(\d{3})(\d{3})(\d{0,4})/, '$1.$2.$3/$4');
    else if (v.length > 5) v = v.replace(/(\d{2})(\d{3})(\d{0,3})/, '$1.$2.$3');
    else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,3})/, '$1.$2');
    el.value = v;
  }

  function mascaraCEP(el) {
    let v = el.value.replace(/\D/g, '').slice(0, 8);
    if (v.length > 5) v = v.replace(/(\d{5})(\d{0,3})/, '$1-$2');
    el.value = v;
  }

  function mascaraTelefone(el) {
    let v = el.value.replace(/\D/g, '').slice(0, 11);
    if (v.length > 6) v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
    else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
    el.value = v;
  }

  function limparErro(campo) {
    document.getElementById('erro-' + campo)?.classList.remove('visivel');
    document.getElementById(campo)?.classList.remove('erro');
  }

  function mostrarErro(campo, msg) {
    const el = document.getElementById(campo);
    const erro = document.getElementById('erro-' + campo);
    if (el) el.classList.add('erro');
    if (erro) { if (msg) erro.textContent = msg; erro.classList.add('visivel'); }
  }

  function validar() {
    let ok = true;
    if (tipoAtual === 'PF') {
      if (!document.getElementById('nome').value.trim()) { mostrarErro('nome'); ok = false; }
      const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
      if (cpf.length !== 11) { mostrarErro('cpf', 'CPF deve ter 11 dígitos'); ok = false; }
    } else {
      if (!document.getElementById('razao').value.trim()) { mostrarErro('razao'); ok = false; }
      const cnpj = document.getElementById('cnpj').value.replace(/\D/g, '');
      if (cnpj.length !== 14) { mostrarErro('cnpj', 'CNPJ deve ter 14 dígitos'); ok = false; }
    }
    if (!document.getElementById('rua').value.trim()) { mostrarErro('rua'); ok = false; }
    if (!document.getElementById('numero').value.trim()) { mostrarErro('numero'); ok = false; }
    if (!document.getElementById('bairro').value.trim()) { mostrarErro('bairro'); ok = false; }
    if (!document.getElementById('cidade').value.trim()) { mostrarErro('cidade'); ok = false; }
    return ok;
  }

  function salvarCliente() {
    if (!validar()) return;

    const cliente = {
      id: clienteEditando ? clienteEditando.id : Date.now(),
      tipo: tipoAtual,
      nome: tipoAtual === 'PF' ? document.getElementById('nome').value.trim() : document.getElementById('razao').value.trim(),
      documento: tipoAtual === 'PF' ? document.getElementById('cpf').value : document.getElementById('cnpj').value,
      responsavel: document.getElementById('responsavel').value.trim(),
      cep: document.getElementById('cep').value,
      rua: document.getElementById('rua').value.trim(),
      numero: document.getElementById('numero').value.trim(),
      complemento: document.getElementById('complemento').value.trim(),
      bairro: document.getElementById('bairro').value.trim(),
      cidade: document.getElementById('cidade').value.trim(),
      estado: document.getElementById('estado').value,
      whatsapp: document.getElementById('whatsapp').value,
      obs: document.getElementById('obs').value.trim(),
      cadastradoEm: clienteEditando ? clienteEditando.cadastradoEm : new Date().toLocaleDateString('pt-BR'),
    };

    if (indiceEditando !== null) {
      clientes[indiceEditando] = cliente;
      mostrarToast('Cliente atualizado ✓');
    } else {
      clientes.push(cliente);
      mostrarToast('Cliente cadastrado ✓');
    }

    salvarStorage();
    limparFormulario();
    mudarAba('lista');
  }

  function limparFormulario() {
    ['nome','razao','cpf','cnpj','responsavel','cep','rua','numero','complemento','bairro','cidade','whatsapp','obs'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    document.getElementById('estado').value = 'SP';
    selecionarTipo('PF');
    clienteEditando = null;
    indiceEditando = null;
    document.querySelectorAll('.msg-erro').forEach(e => e.classList.remove('visivel'));
    document.querySelectorAll('input.erro').forEach(e => e.classList.remove('erro'));
  }

  function renderLista() {
    const busca = document.getElementById('campo-busca').value.toLowerCase();
    const filtrados = clientes.filter(c =>
      c.nome.toLowerCase().includes(busca) ||
      c.documento.replace(/\D/g,'').includes(busca.replace(/\D/g,''))
    );

    const total = clientes.length;
    document.getElementById('total-header').textContent = total > 0 ? total + ' cliente' + (total !== 1 ? 's' : '') : '';
    document.getElementById('contador').textContent = busca
      ? filtrados.length + ' resultado' + (filtrados.length !== 1 ? 's' : '')
      : total + ' cliente' + (total !== 1 ? 's' : '') + ' cadastrado' + (total !== 1 ? 's' : '');

    const lista = document.getElementById('lista-clientes');

    if (filtrados.length === 0) {
      lista.innerHTML = `<div class="lista-vazia">
        <div class="icone">${busca ? '🔍' : '👥'}</div>
        <p>${busca ? 'Nenhum cliente encontrado' : 'Nenhum cliente cadastrado ainda'}</p>
      </div>`;
      return;
    }

    lista.innerHTML = filtrados.map((c, i) => {
      const idx = clientes.indexOf(c);
      return `<div class="card-cliente" onclick="abrirModal(${idx})">
        <div class="card-topo">
          <span class="card-nome">${c.nome}</span>
          <span class="badge-tipo badge-${c.tipo.toLowerCase()}">${c.tipo}</span>
        </div>
        <div class="card-info">
          ${c.documento}<br>
          ${c.rua}, ${c.numero} — ${c.cidade}/${c.estado}
          ${c.whatsapp ? '<br>📱 ' + c.whatsapp : ''}
        </div>
      </div>`;
    }).join('');
  }

  function filtrarLista() { renderLista(); }

  function abrirModal(idx) {
    const c = clientes[idx];
    const endereco = [c.rua, c.numero, c.complemento, c.bairro, c.cidade + '/' + c.estado, c.cep].filter(Boolean).join(', ');

    let html = `
      <p class="badge-tipo badge-${c.tipo.toLowerCase()}" style="margin-bottom:8px">${c.tipo === 'PF' ? 'Pessoa Física' : 'Pessoa Jurídica'}</p>
      <p class="modal-nome">${c.nome}</p>
      <p class="modal-doc">${c.documento}</p>`;

    if (c.responsavel) html += detalhe('Responsável', c.responsavel);
    html += detalhe('Endereço', endereco);
    if (c.whatsapp) html += detalhe('WhatsApp', c.whatsapp);
    if (c.obs) html += detalhe('Observações', c.obs);
    html += detalhe('Cadastrado em', c.cadastradoEm);

    html += `<div class="modal-acoes">
      <button class="btn-editar" onclick="editarCliente(${idx})">Editar</button>
      <button class="btn-excluir" onclick="excluirCliente(${idx})">Excluir</button>
    </div>`;

    document.getElementById('modal-conteudo').innerHTML = html;
    document.getElementById('overlay').classList.add('aberto');
  }

  function detalhe(label, valor) {
    return `<div class="detalhe-linha">
      <span class="detalhe-label">${label}</span>
      <span class="detalhe-valor">${valor}</span>
    </div>`;
  }

  function fecharModal(e) {
    if (e.target === document.getElementById('overlay')) {
      document.getElementById('overlay').classList.remove('aberto');
    }
  }

  function editarCliente(idx) {
    const c = clientes[idx];
    clienteEditando = c;
    indiceEditando = idx;
    document.getElementById('overlay').classList.remove('aberto');
    selecionarTipo(c.tipo);

    if (c.tipo === 'PF') document.getElementById('nome').value = c.nome;
    else document.getElementById('razao').value = c.nome;

    if (c.tipo === 'PF') document.getElementById('cpf').value = c.documento;
    else document.getElementById('cnpj').value = c.documento;

    document.getElementById('responsavel').value = c.responsavel || '';
    document.getElementById('cep').value = c.cep || '';
    document.getElementById('rua').value = c.rua;
    document.getElementById('numero').value = c.numero;
    document.getElementById('complemento').value = c.complemento || '';
    document.getElementById('bairro').value = c.bairro;
    document.getElementById('cidade').value = c.cidade;
    document.getElementById('estado').value = c.estado;
    document.getElementById('whatsapp').value = c.whatsapp || '';
    document.getElementById('obs').value = c.obs || '';

    mudarAba('novo');
    window.scrollTo(0, 0);
  }

  function excluirCliente(idx) {
    if (!confirm('Excluir este cliente? Esta ação não pode ser desfeita.')) return;
    clientes.splice(idx, 1);
    salvarStorage();
    document.getElementById('overlay').classList.remove('aberto');
    renderLista();
    mostrarToast('Cliente removido');
  }

  function mostrarToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('visivel');
    setTimeout(() => t.classList.remove('visivel'), 2500);
  }

  renderLista();
</script>
</body>
</html>
